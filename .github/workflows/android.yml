name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege by default; only the release job may write.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_SIGNING: ${{ secrets.SPENDLY_KEYSTORE_BASE64 != '' && secrets.SPENDLY_KEYSTORE_PASSWORD != '' && secrets.SPENDLY_KEY_ALIAS != '' && secrets.SPENDLY_KEY_PASSWORD != '' }}
    steps:
      # Actions are pinned to full commit SHAs (tag in the comment) to prevent tag-moving attacks.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (validates the wrapper checksum)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Unit, database and UI tests
        run: ./gradlew test --stacktrace

      - name: Android Lint (debug + release)
        run: ./gradlew lint lintRelease

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14

      - name: Restore signing keystore
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.SPENDLY_KEYSTORE_BASE64 }}
        run: |
          umask 077
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/spendly-release.p12"
          echo "SPENDLY_KEYSTORE_FILE=$RUNNER_TEMP/spendly-release.p12" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.HAS_SIGNING == 'true'
        env:
          SPENDLY_KEYSTORE_PASSWORD: ${{ secrets.SPENDLY_KEYSTORE_PASSWORD }}
          SPENDLY_KEY_ALIAS: ${{ secrets.SPENDLY_KEY_ALIAS }}
          SPENDLY_KEY_PASSWORD: ${{ secrets.SPENDLY_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify release APK
        if: env.HAS_SIGNING == 'true'
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT="$ANDROID_HOME/build-tools/36.0.0"
          test -f "$APK"
          "$BT/apksigner" verify --verbose "$APK" | grep -E "Verified using v2 scheme.*: true"
          if "$BT/aapt2" dump badging "$APK" | grep -q "application-debuggable"; then echo "Release APK is debuggable" >&2; exit 1; fi
          if "$BT/aapt2" dump badging "$APK" | grep -q "android.permission.INTERNET"; then echo "Unexpected INTERNET permission" >&2; exit 1; fi

      - name: Remove keystore
        if: always() && env.HAS_SIGNING == 'true'
        run: rm -f "$RUNNER_TEMP/spendly-release.p12"

      - name: Explain unsigned build
        if: env.HAS_SIGNING != 'true'
        run: echo "::notice::Signing secrets are not configured, so no release APK was built. See README > Release signing."

      - name: Upload release APK
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spendly-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spendly-release-apk
          path: dist

      - name: Check tag matches versionName
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $VERSION" >&2; exit 1
          fi

      - name: Create release with APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          test -f app-release.apk || { echo "No signed APK was produced; refusing to publish a release." >&2; exit 1; }
          mv app-release.apk "spendly-${GITHUB_REF_NAME}.apk"
          sha256sum "spendly-${GITHUB_REF_NAME}.apk" > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" "spendly-${GITHUB_REF_NAME}.apk" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "Spendly ${GITHUB_REF_NAME}" --generate-notes --verify-tag
