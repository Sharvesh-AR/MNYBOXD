name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege by default; only the release job may write.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build
    runs-on: ubuntu-latest
    # A normal run takes about 8 minutes; each Gradle step also has its own limit below.
    timeout-minutes: 30
    outputs:
      signed: ${{ steps.signed.outputs.signed }}
    env:
      HAS_SIGNING: ${{ secrets.SPENDLY_KEYSTORE_BASE64 != '' && secrets.SPENDLY_KEYSTORE_PASSWORD != '' && secrets.SPENDLY_KEY_ALIAS != '' && secrets.SPENDLY_KEY_PASSWORD != '' }}
    steps:
      # Actions are pinned to full commit SHAs (tag in the comment) to prevent tag-moving attacks.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (validates the wrapper checksum)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install Android SDK packages
        timeout-minutes: 10
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Fetch Robolectric runtime (with retries)
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3 4; do
            ./gradlew :app:prepareRobolectricRuntime && exit 0
            echo "::warning::Download attempt $attempt failed; retrying"
            sleep $((attempt * 30))
          done
          exit 1

      # Each Robolectric test fails after 2 minutes with a thread dump, and Gradle stops the test
      # task after 15 (app/build.gradle.kts), so a hang shows up as a failure, not a stalled job.
      - name: Unit, database and UI tests
        timeout-minutes: 20
        run: ./gradlew test --stacktrace

      - name: Android Lint (both builds, debug + release)
        timeout-minutes: 20
        run: ./gradlew lintStandardDebug lintVolumeShortcutDebug lintStandardRelease lintVolumeShortcutRelease

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14

      - name: Restore signing keystore
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.SPENDLY_KEYSTORE_BASE64 }}
        run: |
          umask 077
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/spendly-release.p12"
          echo "SPENDLY_KEYSTORE_FILE=$RUNNER_TEMP/spendly-release.p12" >> "$GITHUB_ENV"

      - name: Build signed release APKs (standard + volumeShortcut)
        if: env.HAS_SIGNING == 'true'
        timeout-minutes: 15
        env:
          SPENDLY_KEYSTORE_PASSWORD: ${{ secrets.SPENDLY_KEYSTORE_PASSWORD }}
          SPENDLY_KEY_ALIAS: ${{ secrets.SPENDLY_KEY_ALIAS }}
          SPENDLY_KEY_PASSWORD: ${{ secrets.SPENDLY_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify release APKs
        if: env.HAS_SIGNING == 'true'
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          STANDARD=app/build/outputs/apk/standard/release/app-standard-release.apk
          VOLUME=app/build/outputs/apk/volumeShortcut/release/app-volumeShortcut-release.apk
          for APK in "$STANDARD" "$VOLUME"; do
            test -f "$APK"
            "$BT/apksigner" verify --verbose "$APK" | grep -E "Verified using v2 scheme.*: true"
            if "$BT/aapt2" dump badging "$APK" | grep -q "application-debuggable"; then echo "$APK is debuggable" >&2; exit 1; fi
            if "$BT/aapt2" dump badging "$APK" | grep -q "android.permission.INTERNET"; then echo "Unexpected INTERNET permission in $APK" >&2; exit 1; fi
          done
          # Play Protect blocks browser/file-manager installs of apps declaring any of these
          # (developers.google.com/android/play-protect/warning-dev-guidance). MNYBOXD.apk must declare none.
          if "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$STANDARD" \
              | grep -E "BIND_ACCESSIBILITY_SERVICE|BIND_NOTIFICATION_LISTENER_SERVICE|android.permission.(RECEIVE|READ)_SMS"; then
            echo "MNYBOXD.apk declares a permission that Play Protect blocks for sideloaded apps" >&2; exit 1
          fi

      - name: Remove keystore
        if: always() && env.HAS_SIGNING == 'true'
        run: rm -f "$RUNNER_TEMP/spendly-release.p12"

      - name: Explain unsigned build
        if: env.HAS_SIGNING != 'true'
        run: echo "::notice::Signing secrets are not configured, so no release APK was built. See README > Release signing."

      - name: Report signing status
        id: signed
        run: echo "signed=$HAS_SIGNING" >> "$GITHUB_OUTPUT"

      - name: Upload release APKs
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spendly-release-apk
          path: |
            app/build/outputs/apk/standard/release/app-standard-release.apk
            app/build/outputs/apk/volumeShortcut/release/app-volumeShortcut-release.apk
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    # Only CI-signed builds are published from here. Releases uploaded manually (see README)
    # are left untouched when no signing secrets are configured.
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spendly-release-apk
          path: dist

      - name: Check tag matches versionName
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $VERSION" >&2; exit 1
          fi

      - name: Create release with APKs and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          # upload-artifact keeps paths below the common ancestor (app/build/outputs/apk/).
          STANDARD=standard/release/app-standard-release.apk
          VOLUME=volumeShortcut/release/app-volumeShortcut-release.apk
          for APK in "$STANDARD" "$VOLUME"; do
            test -f "$APK" || { echo "No signed $APK was produced; refusing to publish a release." >&2; exit 1; }
          done
          # Fixed asset names so README's releases/latest/download/MNYBOXD.apk always works.
          mv "$STANDARD" MNYBOXD.apk
          mv "$VOLUME" MNYBOXD-volume-shortcut.apk
          sha256sum MNYBOXD.apk MNYBOXD-volume-shortcut.apk > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" MNYBOXD.apk MNYBOXD-volume-shortcut.apk SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "MNYBOXD ${GITHUB_REF_NAME}" --generate-notes --verify-tag
